# Пример очереди экспериментов. Свои планы держи рядом — они не коммитятся.
#
#     aic plan example --dry-run    посмотреть, что будет запущено
#     aic plan example              пройти очередь до конца
#
# Очередь идёт по порядку, упавший прогон не роняет остальные, а прогон с
# готовым runs/<имя>/summary.json пропускается — после сбоя план просто
# запускается заново и доделывает остаток.

name: example

# переопределения, общие для всей очереди
defaults:
  train.epochs: 6
  data.epoch_size: 8000

runs:
  # опорная точка. Ставится первой: без неё не с чем сравнивать
  - config: baseline

  # один изменённый фактор, имя задано явно
  - config: baseline
    name: example-768
    set:
      data.size: 768

  # grid раскрывается в декартово произведение; имена собираются из значений
  # сетки, здесь получится example-sweep-lr00001 и так далее
  - config: baseline
    name: example-sweep
    grid:
      train.lr: [1.0e-4, 3.0e-4, 1.0e-3]
