# Пример свипа: `grid` раскрывается в декартово произведение, имена прогонов
# собираются автоматически из значений сетки.
#
#   python cli.py plan sweep_area --dry-run
#
# Здесь получится 6 прогонов: e2-sweep-small_area_fraction03-small_weight15,
# ...04-15, ...05-15, ...03-30 и так далее. При бюджете ~40 минут на прогон это
# уже 4 часа — свипы имеет смысл ставить только после того, как базовая
# гипотеза (e2_area против e0_control) подтвердилась.
#
# `defaults` применяется ко всем прогонам плана: здесь эпохи урезаны, потому
# что для сравнения точек сетки между собой хватает и четырёх.

name: sweep-area

defaults:
  train.epochs: 4

runs:
  - config: e2_area
    name: e2-sweep
    grid:
      data.small_area_fraction: [0.3, 0.4, 0.5]
      loss.area.small_weight: [1.5, 3.0]
