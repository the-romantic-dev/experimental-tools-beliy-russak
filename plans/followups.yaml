# Вторая очередь: ставится по результатам `series`, а не вместе с ней.
#
#   python cli.py plan followups --dry-run
#
# Каждый прогон здесь имеет смысл только при определённом исходе первой серии,
# поэтому запускать план целиком обычно не нужно — бери нужное через --only:
#
#   python cli.py plan followups --only e1-res768-pad
#
# * e1-res768-pad     если e1_res768 дал прирост: проверить, не мешает ли ещё и
#                     искажение пропорций (train режет почти квадратные кропы,
#                     а val плющит 1024x683 в квадрат)
# * e3-dual-gate      если e3_srm_input дал прирост: полноценные два потока
# * e2-loss-only /    если сработал e2_area: разложить эффект на сэмплер и лосс
#   e2-sampler-only

name: followups

runs:
  - config: e1_res768_pad
  - config: e3_dual_gate

  - config: e2_area
    name: e2-loss-only
    set:
      data.small_area_fraction: null

  - config: e2_area
    name: e2-sampler-only
    set:
      loss.area.small_weight: 1.0
      loss.area.small_seg: {}
