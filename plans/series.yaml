# Основная серия: опорный прогон плюс три гипотезы из разбора OOF baseline.
#
#   python cli.py plan series --dry-run    посмотреть очередь, ничего не запуская
#   python cli.py plan series              пройти её до конца
#
# Порядок важен: e0_control считается первым, потому что все остальные
# сравниваются именно с ним. Дальше по убыванию ожидаемой отдачи —
# разрешение, мелкие маски, низкоуровневый поток.
#
# e1_res768_pad и e3_dual_gate сюда намеренно НЕ включены: pad имеет смысл
# ставить, только если e1_res768 что-то дал, а полноценные два потока —
# только если сработала дешёвая ступень e3_srm_input. Оба лежат в
# plans/followups.yaml.

name: series

runs:
  - config: e0_control
  - config: e1_res768
  - config: e1_res768_pad
  - config: e2_area
  - config: e3_srm_input
  - config: e3_dual_gate