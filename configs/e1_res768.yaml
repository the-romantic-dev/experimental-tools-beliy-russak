# Эксперимент 1a: разрешение 512 -> 768 при том же бюджете в сэмплах.
#
#   python cli.py train -c e1_res768
#
# Гипотеза. Весь недобор Dice сидит на мелких масках: у корзины <1% площади
# кадра Dice 0.135 и 71% полных промахов, у 1-3% — 0.357 и 36% промахов, а
# выше 6% всё уже хорошо (0.78-0.92). При этом худшие домены (plain 0.640,
# openimages 0.698, vision 0.721) — ровно те, где картинки ~1024 px и ужимаются
# в 512 сильнее всего, а лучшие (coco 0.869) снимаются в 640x480.
# Если дело в потере деталей, 768 должен вытащить корзины <6%.
#
# Батч уменьшен вдвое, accum вдвое больше — эффективный батч остался 16,
# сравнение с e0_control честное. Пикселей в 2.25 раза больше, поэтому и время
# эпохи примерно вдвое больше: это цена эксперимента, а не его дефект.

_base_: _exp_base.yaml

name: e1-res768

data:
  size: 768
  val_mode: resize

train:
  bs: 4
  val_bs: 6
  accum_steps: 4
