# Эксперимент 3a: низкоуровневый поток склейкой по каналам (дешёвая ступень).
#
#   python cli.py train -c e3_srm_input
#
# Гипотеза. У кадров, которые модель промахивает полностью (8.7% позитивов),
# oracle-Dice всего 0.157, а recall внутри GT при пороге 0.05 — 0.16. Сигнала
# в вероятностной карте нет вообще: это не порог и не калибровка, это признаки.
# Семантический ImageNet-энкодер видит правдоподобный объект и не видит следов
# вставки. SRM/Bayar дают ортогональный вход — высокочастотный остаток, где
# содержимое сцены погашено, а разрыв шумовой статистики виден.
#
# Здесь остаток просто приклеивается к RGB: энкодер один, in_channels = 3+6,
# timm корректно переносит предобученные веса стема на новое число входов.
# Стоимость — +0.01M параметров и ноль по памяти.
#
# Порядок ступеней важен: если этот прогон не даёт ничего, у полноценных двух
# энкодеров (e3_dual_gate, +4.6M параметров) шансов немного, и неделю на них
# тратить незачем.

_base_: _exp_base.yaml

name: e3-srm-input

model:
  stream: srm_bayar
  fuse: input
