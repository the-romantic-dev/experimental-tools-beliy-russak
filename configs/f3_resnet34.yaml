# f3 — энкодер с картой признаков на stride 2.
#
#   python cli.py train -c f3_resnet34
#
# Гипотеза. У ConvNeXt стем режет вход сразу вчетверо (patchify 4x4), поэтому
# карты признаков на stride 2 у него НЕ СУЩЕСТВУЕТ. Пирамида выглядит так:
#
#   tu-convnext_tiny  out_channels = [3, 0, 96, 192, 384, 768]
#                     skip_channels = [384, 192, 96, 0, 0]
#
# Ноль на месте stride 2 не опечатка — smp подставляет заглушку. Следствие:
# ДВА ПОСЛЕДНИХ блока U-Net-декодера работают вообще без skip-connection, и
# путь от 128x128 до 512x512 модель проходит чистым апсемплом, не получая от
# энкодера ни одного признака.
#
# Для нашей задачи это подозрительно: границы вставленного объекта и следы
# блендинга — высокочастотный сигнал, который живёт именно в ранних слоях.
# Если восстанавливать его не из чего, страдает Dice, а с ним половина AIC.
#
# У ResNet34 первая свёртка имеет stride 2, и карта там есть:
#
#   tu-resnet34       out_channels = [3, 64, 64, 128, 256, 512]
#                     skip_channels = [256, 128, 64, 64, 0]
#
# Честная оговорка. Меняется не только наличие скипов: у ResNet34 другой объём
# параметров и другое предобучение. Само по себе «f3 > f0» гипотезу не доказывает,
# но опровергнуть может. Если f3 выиграет, следующий шаг — контроль с тем же
# ConvNeXt, но архитектурой, которая на ранние скипы не опирается (fpn/upernet):
# так фактор «энкодер» отделяется от фактора «скипы».
#
# Ожидаемое время: ~1.1 ч (ResNet на Ampere в fp16 быстрее ConvNeXt)

_base_: _f_base.yaml

name: f3-resnet34

model:
  encoder: tu-resnet34
