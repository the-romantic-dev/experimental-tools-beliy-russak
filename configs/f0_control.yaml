# f0 — опорный прогон серии. Никаких изменений, только база 768.
#
#   python cli.py train -c f0_control
#
# Запускать ПЕРВЫМ: без него остальные плечи не с чем сопоставлять.
#
# Двойное назначение. Помимо роли опоры, этот прогон проверяет сам стенд:
# по настройкам он совпадает с e1-res768 (AIC 0.8152), посчитанным до починки
# засева аугментаций. Ожидание — попадание в пределах шума. Если разойдётся
# сильно, разбираться надо с этим, а не читать f1-f4.
#
# Ожидаемое время: ~1.3 ч

_base_: _f_base.yaml

name: f0-control-768
