# f1 — повтор опоры с другим сидом. Меряет ПОЛ ШУМА.
#
#   python cli.py train -c f1_seed7
#
# Зачем тратить прогон на копию. В e-серии четыре плеча из шести уложились в
# разброс 0.02 AIC, и понять, значимо это или нет, было нечем: пола шума никто
# не мерил. |f1 - f0| и есть этот пол. Любой эффект меньше него нельзя называть
# результатом.
#
# Это единственное плечо, которое НЕ проверяет гипотезу о модели, и при этом
# самое важное в серии: без него остальные четыре читаются на глазок.
#
# Меняется ровно один параметр — сид. Он управляет инициализацией декодера,
# порядком сэмплера, аугментациями и добором негативов. Разрешение, бюджет,
# фолд и состав валидации те же.
#
# Ожидаемое время: ~1.3 ч

_base_: _f_base.yaml

name: f1-seed7
seed: 7
