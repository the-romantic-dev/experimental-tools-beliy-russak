# Более сильный декодер и больший вход. Тяжелее по памяти: батч меньше,
# накопление градиента больше, чтобы эффективный батч остался прежним.
#
#   python cli.py train -c upernet_convnext_640

_base_: _base.yaml

name: upernet-convnext-640

# 307.7 из 100 строгих GFLOPs — втрое сверх лимита, и это не про разрешение:
# под лимит эта связка проходит только на 352px, где толку от неё не будет.
# Прогон остаётся как верхняя оценка «что даёт сильный декодер вообще».
budget:
  exempt: true
  exempt_reason: "оценка потолка тяжёлого декодера (307.7 из 100 GFLOPs), в сабмит не идёт"

data:
  size: 640
  # raw, а не cache: на 640 px с convnext_small узкое место — GPU, а не декод,
  # кэш здесь ничего не ускорит (замеры в GUIDE.md, раздел «Ресайз-кэш»)
  source: raw

model:
  arch: upernet
  encoder: tu-convnext_small
  cls_head: from_logits   # у UPerNet в smp нет своей aux-головы

train:
  bs: 4
  val_bs: 6
  accum_steps: 4
  epochs: 10
  lr: 2.0e-4
  encoder_lr: 6.0e-5
