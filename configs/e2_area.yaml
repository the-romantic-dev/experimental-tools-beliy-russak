# Эксперимент 2: перекос обучения в сторону мелких масок.
#
#   python cli.py train -c e2_area
#
# Гипотеза. Мелкие маски (<6% кадра) — это 22% позитивов, но почти весь запас
# по Dice. Мешают им две вещи сразу:
#   1) сэмплинг — их естественная доля мала, градиента на них приходится мало;
#   2) состав лосса — на маске в 1% BCE почти целиком состоит из фона, и
#      «предсказать везде ноль» уже даёт отличную BCE.
# Здесь чинится и то, и другое, поэтому прогон отвечает на вопрос «помогает ли
# смещение в мелкие маски вообще». Разложить вклад сэмплера и лосса по
# отдельности можно потом:
#   -s data.small_area_fraction=null        (только лосс)
#   -s loss.area.small_seg={} -s loss.area.small_weight=1.0   (только сэмплер)
#
# Негативы (площадь ровно 0) в мелкую корзину НЕ попадают и идут по профилю
# по умолчанию — у них мелкой маски нет вовсе, а перекос лосса в сторону
# полноты на чистых кадрах прямо разгонял бы FPR_neg.

_base_: _exp_base.yaml

name: e2-area

data:
  # доля мелких кадров среди позитивов в батче; в данных их 22%
  small_area_fraction: 0.40
  small_area_threshold: 0.06

loss:
  seg: {bce: 1.0, dice: 1.0}          # профиль крупных масок и негативов — как в e0
  area:
    threshold: 0.06
    # focal гасит лёгкий фон, Tversky с beta>alpha делает пропуск дороже лишнего
    small_seg: {bce: 0.5, focal: 1.0, tversky: 1.5}
    small_weight: 2.0
  tversky: {alpha: 0.3, beta: 0.7}
  focal: {alpha: 0.25, gamma: 2.0}
