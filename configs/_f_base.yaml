# Общий бюджет серии f0-f4. Сам по себе не запускается — от него наследуются
# конфиги f0_control, f1_seed7, f2_srm_fixed, f3_resnet34, f4_long.
#
# Почему база теперь 768, а не 512. Серия e0-e3 дала ровно один подтверждённый
# результат: разрешение 768 против 512 это +0.054 AIC, причём выросли обе
# половины метрики сразу (Dice 0.654 -> 0.716, FPR 0.089 -> 0.053). Остальные
# гипотезы уложились в пол шума. Продолжать проверять идеи на проигравшей
# конфигурации смысла нет: у любого улучшения может быть взаимодействие с
# разрешением, а финальная модель всё равно будет жить на 768.
#
# Бюджет намеренно ТОТ ЖЕ, что у e-серии: 8000 сэмплов на эпоху x 6 эпох =
# 48k показов, эффективный батч 16, валидация = четверть позитивов фолда 0
# плюс ВСЕ негативы (5025 + 639 = 5664 кадра).
#
# Это даёт бесплатную проверку самой серии: f0_control по настройкам совпадает
# с уже посчитанным e1-res768 (AIC 0.8152). Если f0 придёт заметно другим,
# значит что-то изменилось в коде между сериями — и это надо понять до того,
# как читать остальные плечи. Заодно f0 меряет эффект починки засева
# аугментаций, которая приехала после e-серии.
#
# Время по замерам e1-res768: 11.3 мин на эпоху, 78 мин на прогон.
# Серия целиком (f0, f1, f2, f3 + удвоенный f4) — около 8 часов.

_base_: _base.yaml

data:
  source: raw          # не cache: кэш обрезан по 768, на этом разрешении он бесполезен
  size: 768
  val_mode: resize     # e1-res768-pad проиграл: потеря пикселей в паддинг перевесила
  aug: medium
  epoch_size: 8000

  val_frac: 0.25
  val_keep_negatives: true

train:
  fold: 0
  epochs: 6
  bs: 4                # 768 px на 8 ГБ: замер даёт ~6.2 ГБ с контекстом CUDA
  val_bs: 6
  accum_steps: 4       # эффективный батч 16 — как во всей e-серии
  early_stop: 0        # бюджет фиксирован, ранняя остановка сломала бы сравнение
  log_every: 200
