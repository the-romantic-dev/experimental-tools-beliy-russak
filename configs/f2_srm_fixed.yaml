# f2 — низкоуровневый поток SRM/Bayar, перезапуск после починки стема.
#
#   python cli.py train -c f2_srm_fixed
#
# Что было. В e-серии это плечо дало худший результат: AIC 0.614 против 0.761
# у контроля. Разбор показал, что дело не в идее, а в дефекте реализации.
# При in_channels = 3+6 timm адаптирует предобученный стем по своему правилу:
# копирует блок RGB-весов три раза и делит всё на 3/9. Замеры:
#
#   |w9[:, :3]| / |w3| = 0.3333     отклик на RGB ослаблен втрое
#   |w9[:, 3:]| / |w3| = 0.6667     две трети веса отданы шумовому остатку,
#                                   пропущенному через ЦВЕТОВЫЕ фильтры ImageNet
#
# Признаки энкодера расходились с RGB-baseline на 37% уже на нулевом шаге,
# до всякого обучения: модель стартовала с испорченного представления и должна
# была переучить стем за 6 эпох.
#
# Косвенное подтверждение из той же серии: e3-dual-gate использует тот же
# ResidualExtractor, но там главный энкодер строится с in_channels=3 и стем не
# трогается, а проекция ветки занулена — старт эквивалентен baseline. Результат
# был -0.009, то есть вровень с контролем, а не -0.147.
#
# Что починено: `restore_pretrained_stem` возвращает RGB-блоку исходный масштаб
# и зануляет каналы остатка. Модель на шаге 0 побитово равна RGB-baseline
# (проверено тестом), а каналы остатка учатся с нуля — градиент по ним
# ненулевой, потому что вход ненулевой. Тот же приём, что и зануление проекции
# в fuse: gate.
#
# Теперь прогон проверяет гипотезу, а не дефект. Ожидание: как минимум выйти на
# уровень f0. Всё, что сверху, — уже настоящий вклад SRM.
#
# Ожидаемое время: ~1.4 ч (ветка добавляет ~5% к шагу)

_base_: _f_base.yaml

name: f2-srm-fixed

model:
  stream: srm_bayar
  fuse: input
