# Эксперимент 1b: то же разрешение 768, но валидация БЕЗ искажения пропорций.
#
#   python cli.py train -c e1_res768_pad
#
# Вторая половина гипотезы про разрешение. Обучение идёт через
# RandomResizedCrop с ratio 0.75-1.33, то есть на почти квадратных кусках без
# растяжения, а валидация в режиме `resize` плющит кадр 1024x683 в квадрат —
# это масштаб 1.5 по одной оси. Train/val рассогласованы, и сильнее всего там
# же, где худшие домены: на широких снимках. `pad` вписывает кадр по длинной
# стороне и добивает полем.
#
# Цена режима: до трети холста уходит в паддинг, полезное разрешение падает.
# Что перевесит — искажение или потеря пикселей — решает этот прогон.
#
# Учёт паддинга в метрике сделан явно (datasets.valid_region + engine._histograms):
# площадь предсказания считается от полезной части, иначе правило FPR
# «площадь >= 1% кадра» срабатывало бы в полтора раза позже, чем на сабмите.

_base_: _exp_base.yaml

name: e1-res768-pad

data:
  size: 768
  val_mode: pad

train:
  bs: 4
  val_bs: 6
  accum_steps: 4
