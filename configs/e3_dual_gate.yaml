# Эксперимент 3b: два потока признаков + обучаемый гейт (та самая идея
# «2 энкодера + гейт», ужатая под 8 ГБ).
#
#   python cli.py train -c e3_dual_gate
#
# Остаток SRM/Bayar идёт в отдельную лёгкую свёрточную ветку, и её фичи
# вливаются в пирамиду основного энкодера на каждой стадии:
#
#     f <- f + sigmoid(gate([f, proj(a)])) * proj(a)
#
# Гейт решает попиксельно, где верить семантике, а где низкоуровневому следу.
# Проекция занулена, а гейт инициализирован закрытым (bias -2), поэтому на шаге
# 0 модель РОВНО равна RGB-baseline и прогон не может развалиться на старте
# из-за случайной второй ветки — она открывается по мере обучения.
#
# Второй полноразмерный энкодер на 8 ГБ рядом с 768 px не помещается, поэтому
# ветка намеренно узкая (stream_width 32, +4.6M параметров): её задача не
# выучить сцену заново, а донести «здесь рвётся статистика шума».
#
# Ветка учится с нуля и лежит внутри энкодера, поэтому она выведена из-под
# encoder_lr — см. engine.SCRATCH_MARKERS, иначе она обучалась бы втрое медленнее
# декодера просто из-за имени параметра.

_base_: _exp_base.yaml

name: e3-dual-gate

model:
  stream: srm_bayar
  fuse: gate
  stream_width: 32

# Батч специально НЕ уменьшен: замер даёт 4.41 ГБ против 4.03 ГБ у e0_control
# на тех же bs 8 / 512 px, то есть ветка помещается без размена на размер
# батча — и сравнение с e0 остаётся чистым по всем остальным параметрам.
