# Общий бюджет серии экспериментов e0-e3. Сам по себе не запускается —
# от него наследуются конфиги e0_control, e1_*, e2_*, e3_*.
#
# Зачем отдельная база. Сравнивать между собой можно только прогоны с
# ОДИНАКОВЫМ бюджетом: числом увиденных сэмплов, расписанием lr и составом
# валидации. Всё это лежит здесь, а конфиг эксперимента меняет ровно один
# фактор. `runs/b1_fast` (AIC 0.8378) сюда не годится как точка отсчёта —
# у него другой бюджет; опорным прогоном служит e0_control.
#
# Бюджет: 24000 сэмплов на эпоху x 6 эпох = 144k показов (3000 шагов на эпоху
# при bs=8). Ориентир по времени на RTX 3070, от измеренных 0.32 c/шаг:
#   512 px — ~1.6 ч обучения + ~0.5 ч валидации = ~2.1 ч на прогон;
#   768 px — ~4.6 ч (бюджет в сэмплах намеренно тот же, шагов вдвое больше
#            из-за bs=4, и каждый шаг дороже по пикселям).
# Серия целиком (e0, e1 x2, e2, e3 x2) — порядка 17.5 часов.

_base_: _base.yaml

data:
  source: raw          # не cache: кэш обрезан по 768 и смазал бы сравнение по разрешению
  size: 512
  aug: medium
  epoch_size: 8000

  # Валидация: позитивы прорежены вчетверо, негативы сохранены ВСЕ.
  # На полном фолде негативов ~610, и именно они дают FPR_neg. При обычном
  # val_frac их осталось бы полторы сотни, и одна ложная тревога двигала бы
  # метрику на 0.007 — больше, чем ожидаемый эффект половины гипотез.
  val_frac: 0.25
  val_keep_negatives: true

train:
  fold: 0
  epochs: 6
  bs: 8
  val_bs: 12
  accum_steps: 2       # эффективный батч 16
  early_stop: 0        # бюджет фиксирован, ранняя остановка сломала бы сравнение
  log_every: 200
