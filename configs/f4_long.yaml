# f4 — та же опора, но вдвое больший бюджет. Отвечает на вопрос «а не мало ли
# мы вообще учим».
#
#   python cli.py train -c f4_long
#
# Зачем. На графиках e-серии ни один из шести прогонов не переобучился:
# val/loss везде продолжает падать на шестой эпохе, val/aic не вышел на плато.
# Это значит, что все выводы серии сделаны в режиме недообучения, и порядок
# мест при большем бюджете может измениться — идея, которая медленнее
# разгоняется, на коротком прогоне проигрывает не по существу.
#
# Здесь удваивается только число эпох (6 -> 12), то есть 96k показов вместо 48k.
# Расписание LR пересчитывается автоматически от длины эпохи и числа эпох,
# так что косинус по-прежнему доходит до конца.
#
# Как читать. Это плечо НЕ сравнивается с f1-f3 напрямую: у него другой бюджет.
# Оно сравнивается только с f0 и отвечает на два вопроса:
#   1) сколько ещё даёт удвоение бюджета — если много, то короткие прогоны
#      систематически недооценивают все гипотезы, и серию надо перемерить;
#   2) где начинается переобучение — по расхождению train/loss и val/loss.
#
# Ожидаемое время: ~2.6 ч

_base_: _f_base.yaml

name: f4-long

train:
  epochs: 12
