[build-system]
# >=77 нужен ради SPDX-записи лицензии (PEP 639) ниже
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "experimental-tools-beliy-russak"
dynamic = ["version"]
description = "Тулкит экспериментов «Белый русак»: сегментация подделанных областей, метрика AIC"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Команда «Белый русак»" }]
keywords = [
    "image-forensics", "manipulation-detection", "segmentation",
    "pytorch", "experiment-tracking",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# torch здесь сознательно нет — см. [project.optional-dependencies].
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",          # pandas.to_parquet для индекса и фолдов
    "scikit-learn>=1.3",      # StratifiedGroupKFold в splits.py
    "matplotlib>=3.7",
    "pillow>=10.0",
    "opencv-python-headless>=4.10",
    "albumentations>=2.0.0",
    "timm>=1.0.20",
    "segmentation-models-pytorch>=0.5.0",
    "tensorboard>=2.16",
]

[project.optional-dependencies]
# torch ставится отдельно и под свою CUDA. Если вписать его сюда, `pip install -e .`
# в conda-среде `challenges` попытается заменить conda-сборку на колесо с PyPI —
# с другой версией CUDA и без гарантии, что карта вообще заведётся.
torch = ["torch>=2.1"]
dev = [
    "pytest>=8.0",
    "jupyterlab>=4.0",
    "nbformat>=5.9",
    "ipykernel>=6.29",
]

[project.urls]
# ЗАМЕНИ НА СВОЙ АДРЕС ПОСЛЕ СОЗДАНИЯ РЕПОЗИТОРИЯ — это единственное место,
# где он нужен; без него на странице пакета не будет ссылки обратно на исходники
Repository = "https://github.com/ЗАМЕНИ-МЕНЯ/experimental-tools-beliy-russak"

[project.scripts]
aic = "experimental_tools_beliy_russak.cli:app"

[tool.setuptools.dynamic]
version = { attr = "experimental_tools_beliy_russak.__version__" }

[tool.setuptools.packages.find]
include = ["experimental_tools_beliy_russak*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
