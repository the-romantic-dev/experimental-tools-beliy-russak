[build-system]
# >=77 нужен ради SPDX-записи лицензии (PEP 639) ниже
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aic"
dynamic = ["version"]
description = "Инструменты для AI Challenge: метрика AIC, достоверность прироста, бюджет, прогоны"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Команда «Белый русак»" }]
keywords = [
    "image-forensics", "manipulation-detection", "segmentation",
    "pytorch", "experiment-tracking",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Зависимости САМОЙ библиотеки: ничего тяжёлого. `pip install <репозиторий>`
# ставит инструменты — метрику, статистику, бюджет, папку прогона, данные,
# сабмит — и не тянет timm, smp и albumentations. torch здесь сознательно нет,
# см. [project.optional-dependencies].
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",          # parquet для индекса, фолдов и строк валидации
    "scikit-learn>=1.3",      # StratifiedGroupKFold в data.make_folds
    "pyyaml>=6.0",
    "pillow>=10.0",
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
# torch ставится отдельно и под свою CUDA. Если вписать его в основные
# зависимости, `pip install -e .` в conda-среде `challenges` попытается заменить
# conda-сборку колесом с PyPI — с другой версией CUDA и без гарантии, что карта
# вообще заведётся.
torch = ["torch>=2.1"]
tb = ["tensorboard>=2.16"]
viz = ["matplotlib>=3.7"]
# эталонный пайплайн: свои конфиги, реестры, модели и команда `aic`
pipeline = [
    "typer>=0.12",
    "timm>=1.0.20",
    "segmentation-models-pytorch>=0.5.0",
    "albumentations>=2.0.0",
    "tensorboard>=2.16",
    "matplotlib>=3.7",
]
dev = [
    "pytest>=8.0",
    "jupyterlab>=4.0",
    "nbformat>=5.9",
    "ipykernel>=6.29",
]

[project.urls]
# ЗАМЕНИ НА СВОЙ АДРЕС ПОСЛЕ СОЗДАНИЯ РЕПОЗИТОРИЯ — это единственное место,
# где он нужен; без него на странице пакета не будет ссылки обратно на исходники
Repository = "https://github.com/the-romantic-dev/experimental-tools-beliy-russak"

[project.scripts]
aic = "aic_pipeline.cli:app"

[tool.setuptools.dynamic]
version = { attr = "aic.__version__" }

[tool.setuptools.packages.find]
# библиотека в корне, пайплайн — слоем сверху в своей папке
where = [".", "pipeline"]
include = ["aic*", "aic_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests", "pipeline/tests"]
